<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador Marol Sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800;1,900&family=Barlow:wght@400;500;600;700&family=Bebas+Neue&family=Graduate&family=Russo+One&family=Teko:wght@600&display=swap">
<style>
/* Layout: oficina de uniforme — prévia fixa à esquerda (frente + costas), bancada de ajustes em abas à direita */
:root{
  --bg:#0A0B0D; --panel:#121418; --panel-2:#181B21; --line:#262A32; --fg:#F4F5F2; --muted:#9AA0A9;
  --accent:#F9CA0D; --accent-ink:#0A0B0D; --ok:#3DDC84;
  --f-display:'Barlow Condensed', 'Arial Narrow', sans-serif; --f-body:'Barlow', system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;min-height:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:rgba(10,11,13,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:36px;width:auto;display:block}
.brand span{font-family:var(--f-display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:20px;letter-spacing:.02em;white-space:nowrap}
.brand span b{color:var(--accent)}
.kitswitch{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.kitswitch button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;min-height:38px;color:var(--muted)}
.kitswitch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,1fr);gap:0;min-height:0}
.stage{position:sticky;top:72px;align-self:start;height:calc(100vh - 72px);display:flex;flex-direction:column;gap:12px;padding:20px;background:radial-gradient(ellipse at 50% 40%,#1C2028 0%,#0E1014 70%);border-right:1px solid var(--line)}
.views{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0}
.view{position:relative;display:flex;flex-direction:column;align-items:center;min-height:0}
.view svg{width:100%;height:100%;max-height:100%;display:block}
.view .lbl{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.stagebar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);font-weight:700;font-size:14px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:#3A404B}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn svg{width:18px;height:18px}
.bench{display:flex;flex-direction:column;min-width:0;background:var(--panel)}
.tabs{position:sticky;top:72px;z-index:5;display:flex;gap:2px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);padding:0 8px;scrollbar-width:none}
.tabs button{flex:none;border:0;background:transparent;padding:14px 12px;font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--muted);border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px}
.tabs button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid currentColor;font-size:11px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button[aria-selected="true"] .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pane{padding:22px 22px 40px;display:flex;flex-direction:column;gap:22px}
.pane h2{margin:0;font-family:var(--f-display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:30px;line-height:1;text-wrap:balance}
.pane h3{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hint{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.group{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#1E1B0E}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.model{border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.model svg{width:100%;height:auto;aspect-ratio:1/1;display:block}
.model span{font-size:12.5px;font-weight:600;text-align:center}
.model small{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.model[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1;min-width:160px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);padding:0 14px}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.zone{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:8px 10px;min-height:48px;text-align:left}
.zone i{width:26px;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.25);flex:none}
.zone b{display:block;font-size:13px}
.zone em{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.zone[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.zone:disabled{opacity:.45;cursor:not-allowed}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:8px}
.sw{aspect-ratio:1/1;border-radius:10px;border:1px solid rgba(255,255,255,.18);min-height:38px;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.field label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);padding:10px 14px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.fonts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.font{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.font b{font-size:30px;line-height:1;font-weight:400}
.font span{font-size:11px;color:var(--muted)}
.font[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.emblems{display:flex;gap:8px;flex-wrap:wrap}
.emb{width:64px;height:64px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center;padding:6px}
.emb img{max-width:100%;max-height:100%}
.emb[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.upload{position:relative;overflow:hidden}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
input[type=range]{accent-color:var(--accent);width:100%;min-height:32px}
.summary{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px}
.summary dt{color:var(--muted)}
.summary dd{margin:0;font-weight:600}
.card{border:1px solid var(--line);background:var(--panel-2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.wa{display:flex;flex-direction:column;gap:6px}
.nextbar{position:sticky;bottom:0;margin-top:auto;display:flex;justify-content:space-between;gap:10px;padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,var(--panel) 70%,rgba(18,20,24,0));z-index:6}
[hidden]{display:none!important}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,6,8,.82);display:grid;place-items:center;padding:20px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;max-width:min(920px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal img{width:100%;height:auto;border-radius:12px;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width: 900px){
  main{grid-template-columns:1fr}
  .stage{position:relative;top:0;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}
  .views{height:min(62vh,460px)}
  .tabs{top:72px}
  .pane{padding:18px 16px 32px}
  .brand span{display:none}
}
@media (max-width: 420px){ .fonts{grid-template-columns:repeat(2,minmax(0,1fr))} .kitswitch button{padding:8px 12px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>

function modelColors(m){ var c={}; for(var k in m.cores) c[k]=m.cores[k]; if(!c.gola) c.gola='#111214'; return c; }
function defaultKit(gk){
  var m=CATALOG[0];
  var shirt = modelColors(m);
  if(gk){ shirt={}; m.zonas.forEach(function(z,i){ shirt[z.id] = ['#B6E21C','#111214','#111214','#111214'][i%4]; }); shirt.gola='#111214'; }
  return {
    model:m.id, pieces:{camisa:true,calcao:true,meiao:true}, include:true,
    colors:{shirt:shirt,shorts:{c1:gk?'#111214':'#FFFFFF',c2:gk?'#B6E21C':'#D61F26'},socks:{c1:gk?'#111214':'#FFFFFF',c2:gk?'#B6E21C':'#D61F26'}}, sync:true,

function K(){ return S.kits[S.active]; }
function eff(k){

}

var SH = {x:73.6, y:8, h:320};
function shirtTransform(m){ var s=SH.h/m.viewBox[1]; return {s:s, tx:200 - m.viewBox[0]*s/2, ty:SH.y}; }

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function txt(x,y,size,k,str){
  var f=FONTS[k.font], fs=(size*f.k).toFixed(1), sw=Math.max(1.5,size*f.k*.035).toFixed(2);

  } else {
    var t = k.collar==='polo'?7000:4200;

function shirtSVG(k,col,view,id){
  var m=modelById(k.model), T=shirtTransform(m), c=col.shirt, tr='translate('+T.tx.toFixed(2)+','+T.ty+') scale('+T.s.toFixed(7)+')';
  var layers = view==='f' ? m.frente : m.costas;
  var o='<g transform="'+tr+'">';
  o+='<path d="'+m.contorno+'" fill="'+(c.base||'#FFFFFF')+'"/>';
  o+='<g clip-path="url(#'+id+'-clipm)">';
  layers.forEach(function(L){ o+='<path d="'+L.d+'" fill="'+(c[L.zona]||'#999')+'"/>'; });
  if(k.cuff==='simples'){ o+='<rect x="0" y="117600" width="45000" height="7000" fill="'+c.gola+'"/><rect x="182500" y="117600" width="43000" height="7000" fill="'+c.gola+'"/>'; }
  o+='</g>';
  o+=collarSVG(k,view,c);
  o+='</g>';
  // costuras
  o+='<g fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1" stroke-dasharray="3 3"><path d="M118,321 Q200,329 282,321"/><path d="M124,34 Q118,90 122,132"/><path d="M276,34 Q282,90 278,132"/></g>';
  // escudo, número, patrocínio
  var cs=k.crest, sp=k.sponsor;
  if(view==='f'){
    var cx = cs.pos==='esquerdo'?240:(cs.pos==='direito'?160:200);
    if(cs.src){ var w=36*cs.size/100; o+=img(cs.src,cx,74,w,w*1.15); }
    if(k.frontNumber && k.number){ var nx = cs.pos==='esquerdo'?160:(cs.pos==='direito'?240:200), ny = cs.pos==='centro'?128:88; o+=txt(nx,ny,38,k,k.number); }
    if(sp.src && sp.pos==='peito'){ var sw2=110*sp.size/100; o+=img(sp.src,200,165,sw2,sw2*.42); }
    if(sp.src && sp.pos==='manga'){ var sw3=30*sp.size/100; o+=img(sp.src,100,95,sw3,sw3*.7); }
  } else {
    var hasName = k.namePos!=='sem' && k.name, nameY = k.namePos==='abaixo'?222:72, numY = (hasName && k.namePos==='abaixo') ? 186 : 198;
    if(hasName) o+=txt(200,nameY,28,k,k.name.toUpperCase());

    if(sp.src && sp.pos==='costas'){ var sw4=100*sp.size/100; o+=img(sp.src,200,262,sw4,sw4*.38); }
  }
  // sombreamento e textura (sobre tudo, recortado no contorno)
  o+='<g clip-path="url(#'+id+'-clip)" pointer-events="none">';
  o+='<rect x="60" y="0" width="280" height="340" fill="url(#'+id+'-mesh)" opacity=".45"/>';
  o+='<rect x="60" y="0" width="280" height="340" fill="url(#'+id+'-shx)"/>';
  o+='<rect x="60" y="0" width="280" height="340" fill="url(#'+id+'-shy)"/>';
  o+='<g filter="url(#'+id+'-blur)" stroke="#000" stroke-opacity=".2" stroke-width="7" fill="none" stroke-linecap="round"><path d="M128,142 Q144,195 152,256"/><path d="M272,142 Q256,195 248,254"/><path d="M150,312 Q200,302 250,314"/><path d="M90,96 Q105,86 118,80"/><path d="M310,96 Q295,86 282,80"/></g>';
  o+='<ellipse cx="'+(view==='f'?172:228)+'" cy="110" rx="62" ry="86" fill="#fff" opacity=".07"/>';
  o+='</g>';
  o+='<g transform="'+tr+'"><path d="'+m.contorno+'" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="'+(1.3/T.s).toFixed(0)+'"/></g>';
  return o;
}
function shortsSVG(k,col,view,id){

function defs(id,m){

function kitSVG(k,view,opts){
  opts=opts||{}; var id='u'+(++UID), col=eff(k), m=modelById(k.model), thumb=opts.thumb;
  var vb = thumb ? '64 0 272 340' : '0 0 400 640';
  var o='<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+vb+'" role="img" aria-label="'+(view==='f'?'Frente':'Costas')+' do uniforme">'+defs(id,m);
  if(!thumb) o+='<ellipse cx="200" cy="630" rx="120" ry="10" fill="url(#'+id+'-floor)"/>';
  if(!thumb && k.pieces.meiao) o+=sockSVG(160,col,id)+'<g transform="translate(400,0) scale(-1,1)">'+sockSVG(160,col,id)+'</g>';
  if(!thumb && k.pieces.calcao) o+=shortsSVG(k,col,view,id);

/* ---------- painéis ---------- */
var TABS=['Modelo','Cores','Gola e punho','Nome e número','Escudo e patrocínio','Orçamento'];
function h(tag,attrs,html){ var e=document.createElement(tag); for(var a in (attrs||{})) e.setAttribute(a,attrs[a]); if(html!=null) e.innerHTML=html; return e; }
function renderTabs(){
  var t=document.getElementById('tabs'); t.innerHTML='';
  TABS.forEach(function(name,i){
    var b=h('button',{type:'button',role:'tab','aria-selected':String(S.tab===i),id:'tab-'+i},'<span class="n">'+(i+1)+'</span>'+name);
    b.onclick=function(){ S.tab=i; renderAll(); window.scrollTo({top:0}); };
    t.appendChild(b);
  });
  document.getElementById('prev').style.visibility = S.tab===0?'hidden':'visible';
  document.getElementById('next').style.visibility = S.tab===TABS.length-1?'hidden':'visible';
  document.getElementById('next').textContent = S.tab<TABS.length-1 ? 'Próximo: '+TABS[S.tab+1] : '';
}
function segGroup(title,opts,cur,set,hint){
  var g=h('div',{class:'group'}); g.appendChild(h('h3',null,title));
  var s=h('div',{class:'seg',role:'group','aria-label':title});
  opts.forEach(function(o){ var b=h('button',{type:'button','aria-pressed':String(cur===o[0])},o[1]); b.onclick=function(){ set(o[0]); renderAll(); }; s.appendChild(b); });
  g.appendChild(s); if(hint) g.appendChild(h('p',{class:'hint'},hint)); return g;
}
function checkbox(label,val,set,id){
  var l=h('label',{class:'check'}); var i=h('input',{type:'checkbox',id:id}); i.checked=!!val; i.onchange=function(){ set(i.checked); renderAll(); };
  l.appendChild(i); l.appendChild(document.createTextNode(label)); return l;
}
function uniq(field){ var o=[]; CATALOG.forEach(function(m){ if(o.indexOf(m[field])<0) o.push(m[field]); }); return o; }
function selectModel(k,m){
  var keepGola=k.colors.shirt.gola;
  k.model=m.id; k.colors.shirt=modelColors(m); if(S.active==='goleiro'||keepGola) k.colors.shirt.gola=keepGola||k.colors.shirt.gola;
  if(S.zone!=='gola' && !m.zonas.some(function(z){return z.id===S.zone;})) S.zone='base';

  p.appendChild(h('h2',null,S.active==='goleiro'?'Modelo do goleiro':'Escolha o modelo'));

  inp.oninput=function(){ S.filter=inp.value; S.shown=PAGE; drawModels(); };

  p.appendChild(segGroup('Categoria',cats.map(function(c){return [c,c];}),S.cat,function(v){S.cat=v;S.shown=PAGE;}));

function readFile(input,cb){
  var f=input.files && input.files[0]; if(!f) return;
  if(f.size>5*1024*1024){ cb(null,'Arquivo maior que 5 MB. Envie uma imagem menor.'); return; }
  var r=new FileReader(); r.onload=function(){ cb(r.result); }; r.readAsDataURL(f);
}

function shirtColorsText(k){
  var m=modelById(k.model), c=eff(k).shirt;
  return [['base','Fundo']].concat(m.zonas.filter(function(z){return z.id!=='base';}).map(function(z){return [z.id,z.nome];})).concat([['gola','Gola/punho']]).map(function(z){ return z[1]+' '+colorName(c[z[0]]); }).join(', ');
}
function describe(k,label){
  var col=eff(k), m=modelById(k.model);
  var pcs=[]; if(k.pieces.camisa) pcs.push('camisa'); if(k.pieces.calcao) pcs.push('calção'); if(k.pieces.meiao) pcs.push('meião');
  return [label+': '+m.nome+' (código '+m.id+')',
    'Peças: '+pcs.join(', '),
    'Camisa: '+shirtColorsText(k),
    'Calção: '+colorName(col.shorts.c1)+' com '+colorName(col.shorts.c2)+' · Meião: '+colorName(col.socks.c1)+' com '+colorName(col.socks.c2),
    'Gola '+({redonda:'redonda',v:'V',polo:'polo'})[k.collar]+' · '+(k.cuff==='simples'?'com punho':'sem punho'),
    'Nome/número: fonte '+FONTS[k.font].label+', '+colorName(k.textColor)+' com contorno '+colorName(k.outline)+', nome '+({acima:'acima do número',abaixo:'abaixo do número',sem:'sem nome'})[k.namePos]+(k.frontNumber?', número no peito':'')+(k.shortsNumber?', número no calção':''),
    'Escudo: '+(k.crest.src?(EMBLEMS.indexOf(k.crest.src)>=0?'exemplo (vou enviar o nosso)':'enviado na simulação'):'sem escudo')+(k.crest.src?' · '+k.crest.pos:'')+' · Patrocínio: '+(k.sponsor.src?'sim ('+k.sponsor.pos+')':'não')];
}
function waLink(){
  var q=S.quote, lines=['Olá, Marol Sports! Montei um uniforme no simulador e quero um orçamento.',''];
  if(q.nome) lines.push('Nome: '+q.nome); if(q.cidade) lines.push('Cidade/UF: '+q.cidade); if(q.qtd) lines.push('Quantidade: '+q.qtd+' uniformes');
  lines.push(''); lines=lines.concat(describe(S.kits.linha,'Uniforme de linha'));
  if(S.kits.goleiro.include){ lines.push(''); lines=lines.concat(describe(S.kits.goleiro,'Goleiro')); }
  if(q.obs){ lines.push(''); lines.push('Observações: '+q.obs); }
  lines.push(''); lines.push('Vou enviar a imagem da simulação aqui na conversa.');
  return 'https://wa.me/'+WA+'?text='+encodeURIComponent(lines.join('\n'));
}

/* ---------- imagem ---------- */
function svgToImage(svgEl,w,hh){
  return new Promise(function(res,rej){
    var c=svgEl.cloneNode(true); c.setAttribute('width',w); c.setAttribute('height',hh);
    var texts=[].slice.call(c.querySelectorAll('text')).map(function(t){ var o={x:+t.getAttribute('x'),y:+t.getAttribute('y'),size:+t.getAttribute('font-size'),fam:t.getAttribute('data-fam'),w:t.getAttribute('data-w'),fill:t.getAttribute('fill'),stroke:t.getAttribute('stroke'),sw:+t.getAttribute('stroke-width'),ls:+t.getAttribute('letter-spacing'),s:t.textContent}; t.parentNode.removeChild(t); return o; });
    var blob=new Blob([new XMLSerializer().serializeToString(c)],{type:'image/svg+xml'}), url=URL.createObjectURL(blob), im=new Image();
    im.onload=function(){ res({img:im,texts:texts,url:url}); }; im.onerror=rej; im.src=url;
  });
}
function makeImage(){
  var fams=Object.keys(FONTS).map(function(x){ return FONTS[x].w+' 40px "'+FONTS[x].fam+'"'; });
  Promise.all(fams.map(function(f){ return document.fonts ? document.fonts.load(f).catch(function(){}) : null; })).then(function(){
    var svgs=[document.querySelector('#vf svg'),document.querySelector('#vb svg')];
    return Promise.all(svgs.map(function(s){ return svgToImage(s,800,1280); }));
  }).then(function(parts){
    var cv=document.createElement('canvas'); cv.width=1760; cv.height=1500; var ctx=cv.getContext('2d');
    var gr=ctx.createRadialGradient(880,650,100,880,650,1100); gr.addColorStop(0,'#1C2028'); gr.addColorStop(1,'#0B0C0F'); ctx.fillStyle=gr; ctx.fillRect(0,0,cv.width,cv.height);
    var m=modelById(K().model);
    ctx.fillStyle='#F9CA0D'; ctx.font='italic 800 46px "Barlow Condensed", sans-serif'; ctx.textAlign='left'; ctx.fillText('MAROL SPORTS',60,90);
    ctx.fillStyle='#9AA0A9'; ctx.font='600 26px Barlow, sans-serif'; ctx.fillText((S.active==='goleiro'?'Goleiro':'Uniforme de linha')+' · '+m.nome+' ('+m.id+')',60,130);
    parts.forEach(function(pt,i){
      var ox=60+i*840, oy=170;
      ctx.drawImage(pt.img,ox,oy,800,1280); URL.revokeObjectURL(pt.url);
      ctx.save(); ctx.translate(ox,oy); ctx.scale(2,2); ctx.textAlign='center'; ctx.lineJoin='round';
      pt.texts.forEach(function(t){ ctx.font=t.w+' '+t.size+'px "'+t.fam+'", Impact, sans-serif'; if('letterSpacing' in ctx) ctx.letterSpacing=t.ls+'px'; ctx.strokeStyle=t.stroke; ctx.lineWidth=t.sw*2; ctx.strokeText(t.s,t.x,t.y); ctx.fillStyle=t.fill; ctx.fillText(t.s,t.x,t.y); });
      ctx.restore();
      ctx.fillStyle='#9AA0A9'; ctx.font='700 24px Barlow, sans-serif'; ctx.textAlign='center'; ctx.fillText(i===0?'FRENTE':'COSTAS',ox+400,oy+1300);
    });
    var url=cv.toDataURL('image/png');
    document.getElementById('out-img').src=url; var dl=document.getElementById('dl'); if(dl) dl.href=url;
    document.getElementById('modal').hidden=false;
  }).catch(function(){
    document.getElementById('modal').hidden=false;
    document.getElementById('out-img').alt='Não foi possível gerar a imagem neste navegador.';
  });
}

};

renderAll();
