<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marol Store — Camisas personalizadas</title>
<meta name="description" content="Camisas personalizadas para times, eventos e o dia a dia. Uniformes sublimados em Helanca Light e Dryfit. Peça seu orçamento pelo WhatsApp.">
<meta property="og:title" content="Marol Store — Camisas personalizadas">
<meta property="og:description" content="Seu estilo. Sua equipe. Sua camisa. Peça seu orçamento pelo WhatsApp.">
<meta property="og:image" content="assets/banner-time.webp">
<meta name="theme-color" content="#0A0B0D">
<link rel="icon" type="image/png" href="assets/favicon-store.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800;1,900&amp;family=Barlow:wght@400;500;600;700&amp;family=Yellowtail&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0D}
a{color:#F4F5F2}a:hover{color:#F9CA0D}
html{scroll-behavior:smooth}
.btn-main{transition:transform .15s ease, box-shadow .15s ease}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(249,202,13,.3);color:#0A0B0D}
.btn-ghost{transition:border-color .15s ease, background .15s ease}
.btn-ghost:hover{border-color:#F4F5F2;background:rgba(255,255,255,.06);color:#F4F5F2}
.cat-tile{transition:transform .25s ease, border-color .25s ease, background .25s ease}
.cat-tile:hover{transform:translateY(-6px);border-color:#F9CA0D;color:#F4F5F2}
.cat-tile:hover .cat-arrow{transform:translateX(6px)}
.cat-arrow{transition:transform .25s ease}
.nl{transition:color .15s ease}
.nl:hover{color:#F9CA0D !important}
.nl-drop{position:relative;display:flex;align-items:center}
.nl-chev{transition:transform .2s ease}
.nl-drop:hover .nl-chev,.nl-drop:focus-within .nl-chev{transform:rotate(180deg)}
.nl-menu{position:absolute;top:100%;left:-14px;padding-top:14px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .18s ease, transform .18s ease, visibility .18s}
.nl-drop:hover .nl-menu,.nl-drop:focus-within .nl-menu{opacity:1;visibility:visible;transform:none}
.nl-panel{display:flex;flex-direction:column;gap:2px;min-width:230px;padding:8px;border-radius:16px;background:#121418;border:1px solid #2A2E35;box-shadow:0 24px 48px rgba(0,0,0,.5)}
.nl-panel .nl{padding:10px 12px;border-radius:10px;white-space:nowrap}
.nl-panel .nl:hover{background:#1C1F24}
@media (max-width:1120px) and (min-width:901px){.nav-links{gap:16px !important;font-size:14px !important}}
.bat-view{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.bat-main{min-width:0;display:flex;flex-direction:column;gap:16px;padding:14px;border-radius:30px;background:#1C0B0F;border:1px solid #3A1A20}
.bat-big{position:relative;aspect-ratio:16/11;border-radius:22px;overflow:hidden;container-type:inline-size;transition:background .4s ease}
.bat-wm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:'Yellowtail','Brush Script MT',cursive;line-height:.82;color:rgba(255,255,255,.16);transform:rotate(-8deg);white-space:nowrap;pointer-events:none}
.bat-logo{position:absolute;left:50%;top:50%;width:96%;height:96%;object-fit:contain;transform:translate(-50%,-50%);opacity:.2;pointer-events:none}
.bat-back{position:absolute;right:7%;top:9%;height:76%;width:auto;transform:rotate(6deg);filter:brightness(.72) drop-shadow(0 22px 22px rgba(0,0,0,.5))}
.bat-front{position:absolute;left:9%;top:11%;height:84%;width:auto;transform:rotate(-4deg);filter:drop-shadow(0 30px 28px rgba(0,0,0,.55))}
.bat-tag{position:absolute;top:14px;left:14px;padding:6px 12px;border-radius:999px;background:rgba(20,8,9,.72);border:1px solid #4A2028;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#C9CDD3}
.bat-info{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding:0 6px 4px}
.bat-story{display:flex;flex-direction:column;gap:10px;margin:0 6px 6px;padding:16px 18px;border-radius:18px;background:#140809;border:1px solid #3A1A20}
.bat-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#F9CA0D;color:#0A0B0D;font-size:13px;font-weight:800;letter-spacing:.04em}
.bat-side{min-width:0;display:flex;flex-direction:column;gap:12px}
.bat-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bat-opt{display:flex;align-items:center;gap:10px;min-height:64px;padding:6px 10px 6px 6px;border-radius:16px;border:1px solid #3A1A20;background:#1C0B0F;color:#F4F5F2;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;line-height:1.2;text-align:left;cursor:pointer;transition:border-color .15s ease, background .15s ease}
.bat-opt:hover{border-color:#5A2A33}
.bat-opt[aria-pressed="true"]{border-color:#F9CA0D;background:#2A1217;box-shadow:inset 0 0 0 1px #F9CA0D}
.bat-thumb{flex:none;width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bat-thumb img{height:44px;width:auto}
@media (max-width:980px){.bat-view{grid-template-columns:minmax(0,1fr)}.bat-side{order:-1}.bat-list{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 -24px;padding:0 24px 4px}.bat-list::-webkit-scrollbar{display:none}.bat-opt{flex:none;max-width:200px}.bat-big{aspect-ratio:1/1}}
.pill{transition:background .15s ease,color .15s ease,border-color .15s ease}
.grab{cursor:grab}.grab:active{cursor:grabbing}
.rv{opacity:0;transform:translateY(46px);transition:opacity .9s ease, transform .9s cubic-bezier(.2,.75,.2,1)}
.rv-l{opacity:0;transform:translateX(-70px);transition:opacity .9s ease, transform .9s cubic-bezier(.2,.75,.2,1)}
.rv-r{opacity:0;transform:translateX(70px);transition:opacity .9s ease, transform .9s cubic-bezier(.2,.75,.2,1)}
.rv-z{opacity:0;transform:scale(.9);transition:opacity .9s ease, transform 1s cubic-bezier(.2,.75,.2,1)}
.rv.in,.rv-l.in,.rv-r.in,.rv-z.in{opacity:1;transform:none}
.wipe{transform:scaleX(0);transform-origin:left;transition:transform 1.1s cubic-bezier(.7,0,.2,1)}
.wipe.in{transform:scaleX(1)}
@keyframes mFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes mDraw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
@keyframes mFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes mPulse{0%{transform:translate(-50%,-50%) scale(1);opacity:.7}100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
@keyframes mDot{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(1)}}
.hs-shirt{animation:mFloat 6s ease-in-out infinite}
.hs-line{stroke-dasharray:420;stroke-dashoffset:420;animation:mDraw 1s cubic-bezier(.6,0,.2,1) forwards}
.hs-label{opacity:0;animation:mFade .7s ease forwards}
.hs-dot{transform:translate(-50%,-50%) scale(0);animation:mDot .4s ease forwards}
.hs-ring{animation:mPulse 2s ease-out infinite}
.hs-list{display:none}
input[type=range].rot{-webkit-appearance:none;appearance:none;background:transparent;height:44px}
input[type=range].rot::-webkit-slider-runnable-track{height:4px;background:#2A2E35;border-radius:4px}
input[type=range].rot::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#F9CA0D;margin-top:-9px;border:3px solid #0A0B0D}
input[type=range].rot::-moz-range-track{height:4px;background:#2A2E35;border-radius:4px}
input[type=range].rot::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#F9CA0D;border:3px solid #0A0B0D}
@media (max-width: 900px){
  nav[aria-label="Principal"]{flex-wrap:wrap;row-gap:10px}
  .nav-links{order:3;width:100%;overflow-x:auto;gap:8px !important;font-size:14px !important;scrollbar-width:none;margin:0 -24px;padding:0 24px 2px}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links .nl{flex:none;padding:8px 12px;border:1px solid #2A2E35;border-radius:999px}
  .nl-drop,.nl-menu,.nl-panel{display:contents !important}
  .nl-menu{visibility:visible !important;opacity:1 !important}
  .nl-chev{display:none}
  .nl-panel .nl{padding:8px 12px;border-radius:999px}
  .hs-lines,.hs-label,.hs-dot{display:none !important}
  .hs-list{display:grid}
  .hs-stage{aspect-ratio:auto !important;height:420px}
  .hs-img{left:10% !important;width:80% !important}
}
@media (prefers-reduced-motion: reduce){
  .hs-shirt{animation:none}
  .rv,.rv-l,.rv-r,.rv-z,.wipe{transition:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="app-tpl">
<div style="font-family: 'Barlow', system-ui, sans-serif; color: #F4F5F2; background: #0A0B0D; width: 100%; overflow-x: clip">

  <!-- NAV -->
  <header style="position: sticky; top: 0; z-index: 30; background: rgba(10,11,13,0.86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid #1C1F24">
    <nav style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 24px" aria-label="Principal">
      <a href="#topo" style="display: flex; align-items: center" aria-label="Marol Store — início">
        <img src="assets/marol-store.png" alt="Marol Store" style="height: 46px; width: auto; display: block">
      </a>
      <div class="nav-links" style="display: flex; align-items: center; gap: 28px; font-size: 15px; font-weight: 600">
        <a class="nl" href="#times" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #C9CDD3"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3"></path><path d="M7 5H4v2a3 3 0 0 0 3 3"></path></svg>Uniformes de time</a>
        <a class="nl" href="#eventos" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #C9CDD3"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>Eventos</a>
<div class="nl-drop">
          <a class="nl" href="#dia-a-dia" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #C9CDD3"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path></svg>Dia a dia<svg class="nl-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
          <div class="nl-menu" role="group" aria-label="Coleções do dia a dia">
            <div class="nl-panel">
              <a class="nl" href="#dia-samba" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #C9CDD3"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>Coleção Samba</a>
              <a class="nl" href="#dia-baterias" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #C9CDD3"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="9" rx="8" ry="3"></ellipse><path d="M4 9v7c0 1.7 3.6 3 8 3s8-1.3 8-3V9"></path><path d="M8 11.7l2 7.1"></path><path d="M16 11.7l-2 7.1"></path><path d="M3 2l7 6"></path><path d="M21 2l-7 6"></path></svg>Baterias Cariocas</a>
            </div>
          </div>
        </div>
        <a class="nl" href="https://simuladormarol.netlify.app/" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: {{accent}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3L3 6l2 5 2-1v11h10V10l2 1 2-5-5-3a4 4 0 0 1-8 0z"></path></svg>Simulador</a>
      </div>
      <a class="btn-main" href="{{waLink}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; background: {{accent}}; color: #0A0B0D; font-weight: 700; font-size: 15px; text-decoration: none; white-space: nowrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"></path></svg>
        Orçamento
      </a>
    </nav>
  </header>

  <!-- HERO -->
  <section id="topo" style="position: relative; padding: 64px 24px 24px; background: radial-gradient(ellipse at 50% 70%, #1A1C21 0%, #0A0B0D 62%)">
    <div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 22px">
      <div style="display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border: 1px solid #2A2E35; border-radius: 999px; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #C9CDD3">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: {{accent}}"></span>
        Camisas personalizadas
      </div>
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 900; text-transform: uppercase; font-size: clamp(54px, 8.4vw, 124px); line-height: 0.88; letter-spacing: -0.01em">Seu estilo. Sua equipe. <span style="color: {{accent}}">Sua camisa.</span></h1>
      <p style="margin: 0; max-width: 720px; font-size: 19px; line-height: 1.6; color: #C9CDD3">Camisas personalizadas que combinam tecidos de qualidade, conforto e estampas cheias de personalidade. Para competir, participar de um evento ou vestir no dia a dia, criamos modelos que representam você.</p>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px">
        <a class="btn-main" href="{{waLink}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 28px; border-radius: 999px; background: {{accent}}; color: #0A0B0D; font-weight: 700; font-size: 17px; text-decoration: none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"></path></svg>
          Peça seu orçamento
        </a>
        <a class="btn-ghost" href="#categorias" style="display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 26px; border-radius: 999px; border: 1px solid #3A3F47; color: #F4F5F2; font-weight: 600; font-size: 17px; text-decoration: none">
          Ver categorias
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M6 13l6 6 6-6"></path></svg>
        </a>
      </div>
    </div>

    <!-- shirt with connected callouts -->
    <div class="hs-stage" style="position: relative; max-width: 1160px; margin: 36px auto 0; aspect-ratio: 1160 / 700">
      <div style="position: absolute; left: 50%; bottom: 2%; width: 40%; height: 7%; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,0.85), rgba(0,0,0,0))"></div>
      <div class="hs-img" style="position: absolute; left: 20.69%; top: 1.43%; width: 58.62%; height: 97.14%">
        <img class="hs-shirt" src="assets/okt-045.webp" alt="Camisa Equipe Oktoberfest Magé, preta com detalhes amarelos, vista de três quartos" style="width: 100%; height: 100%; object-fit: contain; display: block">
      </div>
      <svg class="hs-lines" viewBox="0 0 1160 700" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none">
        <path class="hs-line" d="M510 74 L262 74" fill="none" stroke="{{accent}}" stroke-width="1.5" vector-effect="non-scaling-stroke" style="animation-delay: .5s"></path>
        <path class="hs-line" d="M665 163 L725 150 L898 150" fill="none" stroke="{{accent}}" stroke-width="1.5" vector-effect="non-scaling-stroke" style="animation-delay: .75s"></path>
        <path class="hs-line" d="M760 280 L820 420 L898 420" fill="none" stroke="{{accent}}" stroke-width="1.5" vector-effect="non-scaling-stroke" style="animation-delay: 1s"></path>
        <path class="hs-line" d="M470 452 L390 330 L262 330" fill="none" stroke="{{accent}}" stroke-width="1.5" vector-effect="non-scaling-stroke" style="animation-delay: 1.25s"></path>
        <path class="hs-line" d="M435 588 L262 588" fill="none" stroke="{{accent}}" stroke-width="1.5" vector-effect="non-scaling-stroke" style="animation-delay: 1.5s"></path>
      </svg>
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
        <div class="hs-dot" style="position: absolute; left: {{d.x}}; top: {{d.y}}; width: 14px; height: 14px; animation-delay: {{d.delay}}; pointer-events: none">
          <span class="hs-ring" style="position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; border-radius: 50%; border: 2px solid {{accent}}"></span>
          <span style="position: absolute; inset: 0; border-radius: 50%; background: {{accent}}; box-shadow: 0 0 0 4px rgba(10,11,13,0.75)"></span>
        </div>
      </sc-for>
      <div class="hs-label" style="position: absolute; left: 0; width: 21.5%; top: 10.57%; transform: translateY(-50%); text-align: right; animation-delay: .9s; display: flex; flex-direction: column; gap: 4px">
        <strong style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .01em">Gola do seu jeito</strong>
        <span style="font-size: 14px; line-height: 1.45; color: #A3A8B0">Redonda, V ou padre.</span>
      </div>
      <div class="hs-label" style="position: absolute; left: 0; width: 21.5%; top: 47.14%; transform: translateY(-50%); text-align: right; animation-delay: 1.65s; display: flex; flex-direction: column; gap: 4px">
        <strong style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .01em">Estampa de ponta a ponta</strong>
        <span style="font-size: 14px; line-height: 1.45; color: #A3A8B0">Cores vivas e desenhos bem definidos em toda a peça.</span>
      </div>
      <div class="hs-label" style="position: absolute; left: 0; width: 21.5%; top: 84%; transform: translateY(-50%); text-align: right; animation-delay: 1.9s; display: flex; flex-direction: column; gap: 4px">
        <strong style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .01em">Leve e no caimento certo</strong>
        <span style="font-size: 14px; line-height: 1.45; color: #A3A8B0">Tecido leve, com forma que acompanha o corpo.</span>
      </div>
      <div class="hs-label" style="position: absolute; left: 78.45%; width: 21.5%; top: 21.43%; transform: translateY(-50%); text-align: left; animation-delay: 1.15s; display: flex; flex-direction: column; gap: 4px">
        <strong style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .01em">Helanca Light ou Dryfit</strong>
        <span style="font-size: 14px; line-height: 1.45; color: #A3A8B0">O tecido escolhido conforme a proposta de cada projeto.</span>
      </div>
      <div class="hs-label" style="position: absolute; left: 78.45%; width: 21.5%; top: 60%; transform: translateY(-50%); text-align: left; animation-delay: 1.4s; display: flex; flex-direction: column; gap: 4px">
        <strong style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .01em">Costura de alta qualidade</strong>
        <span style="font-size: 14px; line-height: 1.45; color: #A3A8B0">Acabamento firme em golas, mangas e barras.</span>
      </div>
    </div>
